<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stylesheet/style.css">
     <script src="https://kit.fontawesome.com/cc08ab8254.js" crossorigin="anonymous"></script>
    <title>signup</title>
</head>
<body>
   
        <div class="container">
         <div class="wrapper"> 
                <div class="icon"> 
                 <i class="fa fa-user"></i>
                 </div>

                 <header class="header">
                  <h1>CREATE ACCOUNT.</h1>
            <p>Join us today!.Fill in the details correctly to get stared!.</p>
                    </header>

                 <label>FIRST Name</label>
                 <div class="input-field">
      <input type="text" id="firstName" placeholder="Enter first name">
      <i class="fa fa-user"></i>

         <label>Middle Name</label>
       <input type="text" id="middleName" placeholder= "Enter middle name">
        <i class="fa fa-user"></i>

        <label>Other name</label>
        <input type="text" id="otherName" placeholder="Enter other name">
        <i class="fa fa-user"></i>

        <label>Email Address</label>
            <input type="text" id="Email" placeholder="Enter email address">
             <i class="fa fa-envelope"></i>

            <label>Password</label>
            <input type="password" id="password" placeholder="Enter password">
             <i class="fa fa-lock"></i>

            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Enter confirm password">
               <i class="fa fa-lock"></i>
               <!-- GENDER -->
                 <div class="Gender"> 
            <label>Gender:</label>
              <input type="checkbox">
              <label>Male</label>
              <label>Female</label>
              <input type="checkbox">
              </div>

       <p id="message"></p>
           
       <!-- CHECK BOX -->
          <div class="check"> 
          <input type="checkbox" id="checkbox"> 
            <label> By signup you agreed to our <a href="T&C.html">T&C?.</a></label> 
          </div>
         <br>
        <button class="signupBTN" id="signup">Summit</button>
       <br>

         
          <!-- ALREADY HAVE AN ACCOUNT -->
           <p>Already have an account? <a href="login.html">Login</a></p>
        </div>
           </div> 
          
</body>
</html>
